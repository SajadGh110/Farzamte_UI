<div class="dialog-container">
  <!-- هدر -->
  <div class="dialog-header">
    <div class="header-left">
      <div class="icon-wrapper">
        <i class="material-icons">{{ sectionIcon }}</i>
      </div>
      <h2>{{ sectionTitle }}</h2>
    </div>
    <button class="close-btn" (click)="close()">×</button>
  </div>

  <!-- بارگذاری -->
  <div class="loading-state" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <span>در حال بارگذاری اطلاعات...</span>
  </div>

  <!-- خطا -->
  <div class="error-state" *ngIf="error && !loading">
    <i class="material-icons">error_outline</i>
    <span>مشکلی در دریافت اطلاعات به وجود آمد. لطفاً مجدداً تلاش کنید.</span>
  </div>

  <!-- محتوا -->
  <ng-container *ngIf="!loading && !error">
    <p class="dialog-description">{{ description }}</p>

    <!-- نمودار (در صورت وجود) - می‌تونه یک کامپوننت مجزا باشه -->
    <mat-spinner *ngIf="!flag_inc" class="center-spinner"></mat-spinner>
    <div class="chart-box" *ngIf="flag_inc">
      <div echarts [options]="series_calls_count_day" class="chart-container"></div>
    </div>

  </ng-container>

  <!-- دکمه‌ها -->
  <div class="dialog-actions">
    <button class="btn-primary" (click)="navigateToRoute()">
      <i class="material-icons">arrow_forward</i>
      مشاهده کامل
    </button>
    <button class="btn-outline" (click)="close()">بستن</button>
  </div>
</div>
